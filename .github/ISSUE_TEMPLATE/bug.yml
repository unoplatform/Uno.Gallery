name: Bug Report
description: Report a bug or broken sample in Uno Gallery.
title: "[Bug]: "
labels: ["kind/bug", "triage/untriaged"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Fill in as much detail as possible so we can reproduce and fix it.

  - type: input
    id: sdk_version
    attributes:
      label: Uno.Sdk version
      description: >
        Find this in `global.json` (`msbuild-sdks."Uno.Sdk"`) or in your NuGet package version.
      placeholder: "e.g. 6.6.42"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows (WinAppSDK)
        - Android
        - iOS
        - macOS (Catalyst)
        - Linux (Skia Desktop)
        - WebAssembly
    validations:
      required: true

  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      description: Which rendering mode were you using?
      options:
        - Native (DOM / WinUI native)
        - Skia
        - Not applicable / Not sure
    validations:
      required: true

  - type: dropdown
    id: design_system
    attributes:
      label: Design system
      description: Which design-system tab were you viewing when the bug occurred?
      options:
        - Material
        - Fluent
        - Cupertino (Debug / Canary builds only)
        - Agnostic / Not applicable
        - Not sure
    validations:
      required: false

  - type: dropdown
    id: release_channel
    attributes:
      label: Release channel
      options:
        - Stable web deployment
        - Canary build
        - Play alpha
        - TestFlight
        - Local source build
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - App cannot start or data is lost
        - Core navigation or a stable sample is unusable
        - Behavior is incorrect but a workaround exists
        - Visual, accessibility, localization, or performance regression
        - Minor or cosmetic issue
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Open Uno Gallery
        2. Navigate to '...'
        3. Click '...'
        4. Observe '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: >
        Attach relevant logs, screenshots, or recordings.
        You can drag and drop files directly into this field.
    validations:
      required: false

  - type: input
    id: upstream_issue
    attributes:
      label: Related upstream issue
      description: Link an Uno, Toolkit, Themes, Extensions, WinUI, or dependency issue if the root cause may be upstream.
      placeholder: "https://github.com/unoplatform/uno/issues/..."
    validations:
      required: false
